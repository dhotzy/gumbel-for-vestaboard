<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 440 642' width='440' height='642' font-family='Inter, -apple-system, Segoe UI, Roboto, sans-serif'><rect width='440' height='642' rx='18' fill='#f3f2ee'/><defs><marker id='a' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0,0L10,5L0,10z' fill='#9a9a94'/></marker></defs><text x='24' y='40' font-size='18' font-weight='700' fill='#17181b' text-anchor='start' xml:space='preserve'>Three ways onto the board</text><rect x='24' y='60' width='392' height='96' rx='12' fill='#ffffff' stroke='#e2e1dc'/><text x='44' y='90' font-size='17' font-weight='700' fill='#17181b' text-anchor='start' xml:space='preserve'>Webhook</text><text x='396' y='90' font-size='13' font-weight='600' fill='#6e7076' text-anchor='end' xml:space='preserve'>The service sends</text><text x='44' y='116' font-size='13.5' font-weight='400' fill='#17181b' text-anchor='start' xml:space='preserve'>POST with X-Key to Gumbel · instant</text><text x='44' y='138' font-size='12.5' font-weight='400' fill='#6e7076' text-anchor='start' xml:space='preserve'>the service must be able to reach Gumbel</text><rect x='24' y='166' width='392' height='96' rx='12' fill='#ffffff' stroke='#e2e1dc'/><text x='44' y='196' font-size='17' font-weight='700' fill='#17181b' text-anchor='start' xml:space='preserve'>Fetch</text><text x='396' y='196' font-size='13' font-weight='600' fill='#6e7076' text-anchor='end' xml:space='preserve'>Gumbel collects</text><text x='44' y='222' font-size='13.5' font-weight='400' fill='#17181b' text-anchor='start' xml:space='preserve'>GET every 5 min – 1 day · JSON or RSS</text><text x='44' y='244' font-size='12.5' font-weight='400' fill='#6e7076' text-anchor='start' xml:space='preserve'>custom headers for API keys</text><rect x='24' y='272' width='392' height='96' rx='12' fill='#ffffff' stroke='#e2e1dc'/><text x='44' y='302' font-size='17' font-weight='700' fill='#17181b' text-anchor='start' xml:space='preserve'>Messenger</text><text x='396' y='302' font-size='13' font-weight='600' fill='#6e7076' text-anchor='end' xml:space='preserve'>People write</text><text x='44' y='328' font-size='13.5' font-weight='400' fill='#17181b' text-anchor='start' xml:space='preserve'>Telegram bot or Slack /board</text><text x='44' y='350' font-size='12.5' font-weight='400' fill='#6e7076' text-anchor='start' xml:space='preserve'>approval per person · confirmation</text><line x1='220.0' y1='378' x2='220.0' y2='404' stroke='#9a9a94' stroke-width='2' marker-end='url(#a)'/><rect x='24' y='410' width='392' height='50' rx='14' fill='#fff8d6' stroke='#f6c90e'/><text x='220.0' y='441' font-size='15' font-weight='700' fill='#17181b' text-anchor='middle' xml:space='preserve'>Gumbel: template → queue</text><line x1='220.0' y1='460' x2='220.0' y2='486' stroke='#9a9a94' stroke-width='2' marker-end='url(#a)'/><rect x='105.0' y='492' width='230' height='86' rx='10' fill='#151517' stroke='#151517'/><text x='220.0' y='518' text-anchor='middle' font-size='15' font-weight='700' letter-spacing='3' fill='#f3f2ee' font-family='Menlo, Consolas, monospace'>GOOD</text><text x='220.0' y='540' text-anchor='middle' font-size='15' font-weight='700' letter-spacing='3' fill='#f3f2ee' font-family='Menlo, Consolas, monospace'>MORNING</text><text x='220.0' y='562' text-anchor='middle' font-size='15' font-weight='700' letter-spacing='3' fill='#f3f2ee' font-family='Menlo, Consolas, monospace'>♥</text><text x='24' y='604' font-size='13' font-weight='600' fill='#6e7076' text-anchor='start' xml:space='preserve'>Everything else via a bridge:</text><text x='24' y='624' font-size='13' font-weight='400' fill='#6e7076' text-anchor='start' xml:space='preserve'>Make · Zapier · IFTTT · n8n · Home Assistant</text></svg>
