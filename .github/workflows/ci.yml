name: CI

on:
  push:
  pull_request:

# Nur Lesen – der Workflow braucht keine Schreibrechte und keine Secrets
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, intl, curl
      - name: Syntax
        run: for f in public/*.php public/api/*.php src/*.php lang/en/*.php docker/*.php; do php -l "$f" > /dev/null || exit 1; done
      - name: Tests
        run: for t in tests/*-test.php; do echo "== $t"; php "$t" | tail -1; php "$t" > /dev/null || exit 1; done

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gumbel:ci .
      - name: Start container and check setup + cron
        run: |
          docker run -d --name gumbel -p 8080:80 -e GUMBEL_BOARD=log -e GUMBEL_CRON_KEY=ci-key gumbel:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8080/login.php && break; sleep 1; done
          curl -fsS http://localhost:8080/login.php | grep -qi "setup.php"
          curl -fsS "http://localhost:8080/setup.php?key=ci-key" | grep -qi "<form"
          curl -fsS "http://localhost:8080/cron.php?key=ci-key" | grep -q '"action"'
          docker logs gumbel
